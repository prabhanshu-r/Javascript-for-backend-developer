<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Fetch Example</title>
    <!-- Connects to your CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Backend Data Fetcher</h1>
        <button id="fetchButton">Get User Data</button>
        
        <!-- The JS will inject data here -->
        <div id="resultBox" class="hidden"></div>
    </div>

    <!-- Connects to your JS file (placed at the bottom so HTML loads first) -->
    <script src="script.js"></script>
</body>
</html>
